name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 와이어프레임 구조 검증
        run: node scripts/validate-wireframes.mjs wireframes.html

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Pages 설정
        uses: actions/configure-pages@v5
      - name: 정적 페이지 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4

