<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>멧챠 카멜레온 공개 설계</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; --ink:#1d2430; --muted:#667085; --line:#d9dee7; --purple:#6547d7; --soft:#f5f2ff; }
    * { box-sizing: border-box; }
    body { margin:0; color:var(--ink); background:#fff; line-height:1.65; word-break:keep-all; }
    main { width:min(780px, calc(100% - 36px)); margin:0 auto; padding:68px 0 100px; }
    .mark { width:44px; height:6px; margin-bottom:24px; background:var(--purple); }
    h1 { margin:0 0 12px; font-size:clamp(1.8rem, 5vw, 2.65rem); letter-spacing:-.045em; }
    .lead { margin:0 0 28px; color:var(--muted); font-size:1.05rem; }
    .primary { display:inline-flex; min-height:48px; align-items:center; padding:0 18px; border-radius:10px; color:#fff; background:var(--purple); font-weight:800; text-decoration:none; }
    .status { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin-top:38px; }
    .card { padding:20px; border:1px solid var(--line); border-radius:12px; }
    .card span { display:block; margin-bottom:5px; color:var(--muted); font-size:.8rem; font-weight:750; }
    .card strong { font-size:1.08rem; }
    .note { margin-top:22px; padding:16px 18px; border-left:4px solid var(--purple); background:var(--soft); }
    .note p { margin:0; }
    @media (max-width:560px) { main { padding-top:42px; } .status { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>멧챠 카멜레온</h1>
    <p class="lead">촬영 직후 축제 웹에서 적립하고, 카카오로 받은 보호 링크에서 이어하기·확인·사용하는 흐름입니다.</p>
    <a class="primary" href="wireframes.html">연결 와이어프레임 보기</a>

    <section class="status" aria-label="현재 상태">
      <div class="card"><span>사용자 흐름</span><strong>설계됨</strong></div>
      <div class="card"><span>앱·API 구현</span><strong>구현 전</strong></div>
    </section>
    <aside class="note"><p>사진 1~3장의 최종 성공 집계와 스탬프·쿠폰 발급 기준은 아직 확인이 필요합니다. 와이어프레임은 이를 확정 규칙처럼 표현하지 않습니다.</p></aside>
  </main>
</body>
</html>
